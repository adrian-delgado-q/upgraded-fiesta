database_path: storage/job_system.db
artifacts_dir: storage/artifacts
rules_path: config/rules.yaml
active_profile: software_platform
pandoc_binary: pandoc
log_level: INFO
scraper:
  api_key: ""
  api_key_env: SERP_API_TOKEN
  providers:
    - ashby
    - lever
    - greenhouse
  max_pages: 150
  max_pages_per_company: 40
  max_depth: 2
  search_results_per_query: 50
llm:
  provider: deepseek
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-reasoner
  prompt_version: framework-v1
  enabled: true
  timeout_seconds: 45
worker:
  poll_seconds: 10
  log_idle_cycles: 6
