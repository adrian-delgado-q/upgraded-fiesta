[project]
name = "upgraded-fiesta"
version = "0.1.0"
description = "Reusable role-agnostic job collection and scoring framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "scrapy>=2.11,<3",
  "sqlmodel>=0.0.22,<0.1",
  "streamlit>=1.37,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
upgraded-fiesta = "collector.cli:main"
run-job-console = "run_console:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_console"]
packages = ["collector", "collector.scraper", "console", "console.backend", "console.backend.app", "console.backend.app.api", "console.frontend", "console.frontend.components", "console.frontend.pages", "shared"]
