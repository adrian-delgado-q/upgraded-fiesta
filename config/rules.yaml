active_profile: robotics_platform_validation

profiles:
  base_framework:
    target_locations:
      countries:
        canada:
          aliases: [Canada]
          regions: [toronto, ontario, vancouver, british columbia, montreal]
        united_states:
          aliases: [usa, us, United States]
          regions: [remote, new york, boston, seattle, san francisco, miami]
    normalization:
      title_replacements:
        qa: quality assurance
        sdet: software development engineer in test
        sr.: senior
        sre: site reliability engineer
        devops: devops
        infra: infrastructure
        hil: hardware in the loop
        ci/cd: ci cd
      seniority_taxonomy:
        - value: staff
          keywords: [staff, principal, lead]
        - value: senior
          keywords: [senior, sr., senior ii, senior iii]
        - value: junior
          keywords: [junior, intern, apprentice, new grad, graduate]
        - value: mid
          keywords: []
      work_mode_taxonomy:
        - value: hybrid
          keywords: [hybrid]
        - value: remote
          keywords: [remote, work from home, distributed]
        - value: onsite
          keywords: [onsite, on-site, field based, site based, commissioning, travel required]

    extraction:
      vocabularies:
        skills:
          terms:
            - python
            - golang
            - typescript
            - javascript
            - bash
            - linux
            - pytest
            - selenium
            - playwright
            - behave
            - graphql
            - grpc
            - rest api
            - docker
            - docker compose
            - terraform
            - aws
            - azure
            - iam
            - ec2
            - sns
            - cloudwatch
            - nomad
            - sql
            - bigquery
            - pydantic
            - numpy
            - fastapi
            - uvicorn
            - pytorch
            - chromadb
            - llamaindex
            - redis
            - postgresql
            - jira
            - xray
            - gherkin
            - oauth
            - oidc
            - protobuf
            - sftp
            - ssh
            - packer
            - github actions
            - gitlab ci
            - azure pipelines
        tools:
          terms:
            - datadog
            - cloudwatch
            - prometheus
            - grafana
            - github actions
            - gitlab ci
            - azure pipelines
            - jira xray
            - docker
            - docker compose
            - nomad
            - bigquery
            - packer
            - terraform
            - sns
            - ec2
            - iam
            - mkdocs
        certifications:
          terms: []
        domains:
          terms:
            - robotics
            - autonomy
            - validation
            - verification
            - quality engineering
            - software quality
            - hardware in the loop
            - release engineering
            - devops
            - infrastructure
            - reliability
            - commissioning
            - site acceptance
            - production systems
            - distributed systems
            - observability
            - fleet operations
            - industrial automation
            - cloud infrastructure
            - test automation
            - systems integration
            - state machines
            - safety systems
            - perception systems
            - microservices
            - ai
            - machine learning
            - computer vision
            - rag

      signals:
        robotics:
          weight: 12
          group: domain
          sentiment: positive
          terms: [robotics, robotic systems, robot, fleet, autonomous systems]

        autonomy:
          weight: 9
          group: domain
          sentiment: positive
          terms: [autonomy, autonomous, navigation, motion control, perception]

        hardware_in_the_loop:
          weight: 13
          group: domain
          sentiment: positive
          terms: [hardware in the loop, hil, real hardware, hardware runner]

        validation:
          weight: 10
          group: domain
          sentiment: positive
          terms: [validation, system validation, integration validation, post installation validation, piv]

        verification:
          weight: 9
          group: domain
          sentiment: positive
          terms: [verification, requirement verification, verification engineering]

        release_engineering:
          weight: 12
          group: domain
          sentiment: positive
          terms: [release engineering, release readiness, release gates, promotion, canary, stable rollout]

        fleet_release:
          weight: 13
          group: domain
          sentiment: positive
          terms: [fleet, fleet scale, rollout, canary, deployment windows, production robots]

        reliability:
          weight: 9
          group: domain
          sentiment: positive
          terms: [reliability, site reliability, production reliability, resilience, incident response]

        observability:
          weight: 9
          group: keyword
          sentiment: positive
          terms: [observability, monitoring, metrics, dashboards, logging, cloudwatch, datadog, grafana, prometheus]

        ci_cd:
          weight: 9
          group: keyword
          sentiment: positive
          terms: [ci cd, ci/cd, pipeline, pipelines, github actions, gitlab ci, azure pipelines, build health]

        containers:
          weight: 8
          group: keyword
          sentiment: positive
          terms: [docker, container, containers, docker compose, containerized, image, images]

        orchestration:
          weight: 8
          group: keyword
          sentiment: positive
          terms: [nomad, orchestration, workload orchestration, distributed deployment]

        cloud_infrastructure:
          weight: 8
          group: keyword
          sentiment: positive
          terms: [aws, ec2, iam, sns, cloudwatch, terraform, packer, vpc, subnet, nat gateway]

        test_automation:
          weight: 10
          group: keyword
          sentiment: positive
          terms: [pytest, playwright, selenium, behave, automation framework, automated validation]

        systems_integration:
          weight: 8
          group: keyword
          sentiment: positive
          terms: [graphql, grpc, rest api, integration testing, microservices, distributed systems]

        data_analytics:
          weight: 7
          group: keyword
          sentiment: positive
          terms: [sql, bigquery, dashboards, metrics, analytics, trend analysis, reporting]

        ai_ml:
          weight: 5
          group: keyword
          sentiment: positive
          terms: [ai, machine learning, computer vision, pytorch, rag, llamaindex, chromadb]

        support_role:
          weight: 20
          group: negative
          sentiment: negative
          terms: [customer support, technical support, helpdesk, call center, ticket queue]

        operator_role:
          weight: 22
          group: negative
          sentiment: negative
          terms: [operator, operations associate, machine operator]

        technician_role:
          weight: 18
          group: negative
          sentiment: negative
          terms: [technician, field technician, repair technician, maintenance technician]

        manual_only_qa:
          weight: 14
          group: negative
          sentiment: negative
          terms: [manual testing only, qa analyst, test execution only, manual tester]

        low_scope_it:
          weight: 16
          group: negative
          sentiment: negative
          terms: [desktop support, laptop deployment, printer support, end user support]

    scoring:
      prefilter:
        - reason: Rejected due to junior or internship title signal
          when:
            - field: title_normalized
              operator: contains_any
              values: [intern, internship, junior, apprentice, new grad, graduate]

        - reason: Rejected due to support or low-scope IT title
          when:
            - field: title_normalized
              operator: contains_any
              values: [helpdesk, support specialist, desktop support, technician, operator]

        - reason: Rejected due to non-engineering customer support description
          when:
            - field: description
              operator: contains_any
              values: [high volume ticket queue, customer escalations, call center, end user support]

      categories:
        title:
          kind: rules
          default_score: 0
          rules:
            - score: 38
              reason: Strong core alignment to robotics validation, release, or systems quality
              when:
                - field: role_family
                  operator: in
                  values:
                    [
                      robotics_validation,
                      sdet_validation,
                      release_quality,
                      systems_quality,
                      site_acceptance_commissioning
                    ]

            - score: 32
              reason: Strong secondary alignment to platform or reliability
              when:
                - field: role_family
                  operator: in
                  values:
                    [
                      platform_devops,
                      reliability_sre,
                      production_platform
                    ]

            - score: 15
              reason: Broader engineering overlap
              when:
                - field: title_normalized
                  operator: contains_any
                  values: [engineer, systems, platform, release, validation, reliability]

        seniority:
          kind: value_map
          field: seniority
          default_score: 0
          map:
            staff: 10
            senior: 8
            mid: 4
            junior: -25

        location:
          kind: rules
          default_score: 0
          rules:
            - score: 10
              reason: Preferred region with remote flexibility
              when:
                - field: location_country
                  operator: in
                  values: [canada, united states]
                - field: work_mode
                  operator: equals
                  value: remote

            - score: 7
              reason: Allowed country
              when:
                - field: location_country
                  operator: in
                  values: [canada, united states]

            - score: -30
              reason: Location outside allowed countries
              when:
                - field: location_country
                  operator: not_in
                  values: [canada, united states]

        salary:
          kind: rules
          default_score: 0
          rules:
            - score: 0
              when:
                - field: salary_min_cad
                  operator: missing

            - score: -40
              reason: Salary below desired floor
              when:
                - field: salary_min_cad
                  operator: lt
                  value: 110000

            - score: 6
              reason: Salary at or above desired floor
              when:
                - field: salary_min_cad
                  operator: gte
                  value: 110000

        domain:
          kind: signal_group
          signal_group: domain
          default_score: 0
          cap: 35

        keyword:
          kind: signal_group
          signal_group: keyword
          default_score: 0
          cap: 25

        negative:
          kind: signal_group
          signal_group: negative
          default_score: 0
          floor: -40

      thresholds:
        shortlisted: 100
        review: 95
        maybe: 70

      llm:
        analyze_threshold: 35
        deterministic_weight: 0.65
        llm_weight: 0.35

    llm:
      extraction_enabled: true
      evaluation_enabled: true
      extraction_guidance: >
        Extract reusable job facets with emphasis on robotics systems, validation rigor,
        HIL, release engineering, cloud platform work, CI/CD ownership, observability,
        distributed systems, and commissioning readiness.
      evaluation_guidance: >
        Judge fit against the active profile as a robotics validation, release, and platform-oriented engineer.
        Strongly reward jobs involving system ownership, real production environments, hardware-software integration,
        CI/CD, cloud observability, and data-backed engineering decisions. Penalize generic support, technician,
        or manual-only QA roles.

    search:
      providers: [ashby, lever, greenhouse]

    defaults:
      role_family: general
      seniority: mid
      work_mode: ""
      location_country: ""

